# vivo settings (T018).
#
# Editable by hand or from the web settings pane (gear button). On save the
# file is regenerated from these values; comments come from the schema.
# Precedence at runtime: environment variable > this file > built-in default.

[llm]
# Language model
# OpenAI-compatible endpoint serving the chat model (the llama.cpp server).
base_url = "http://host.docker.internal:8080/v1"
# Model name the LLM server serves, e.g. qwen3.8-27b.
model = "qwen3.8-27b"
# Let the model reason before answering. Adds latency but improves answers, especially with tools. vivo speaks filler phrases while it thinks.
thinking = true
# Generation budget per reply (thinking + answer together). Too low truncates answers; too high wastes latency.
max_tokens = 608

[persona]
# Persona & prompt
# One or two sentences describing who vivo is. Prepended to the system prompt.
blurb = "You are vivo, a helpful voice assistant. Keep replies to one or two short spoken sentences."
# Voice-UX instructions appended to the persona: how to speak, when to use tools, how to summarise results.
system_prompt = "You are a hands-free voice assistant; your replies are spoken aloud. Keep replies to one or two short spoken sentences and summarise tool results in plain words; never read raw output, code, or lists aloud. You have a sandboxed shell (exec) and file tools (read_file, write_file, list_dir) in the workspace directory (/workspace), current weather, web search, and web page reading. Prefer quick commands. Before a tool call that may take a while (search, fetch, long command), first say in a few words what you are doing. If a tool fails, try once differently, then say what went wrong. Earlier conversation context may be included; use it naturally and do not repeat it back."

[user]
# User profile
# vivo addresses you by this name.
name = "Rob"
# Your place, e.g. "Bristol, UK". Default for weather questions; ask about other places by name.
location = "Gloucester, UK"
# IANA time zone, e.g. "Europe/London". Used for time questions; empty means the container's time zone (UTC).
timezone = "Europe/London"
# Units in weather answers: metric is °C and km/h, imperial is °F and mph.
units = "metric"

[filler]
# Thinking fillers
# How long vivo waits without speakable text before starting to fill the silence with a phrase.
first_after_s = 3
# Gap between repeated filler phrases while the model keeps thinking.
interval_s = 40
# Short phrases vivo speaks while thinking, one per line. Keep them brief — each one is synthesised separately.
phrases = ["Let me think about that one more indepth.", "Hmmmm.... that's a tough one, this needs some thought.", "Give me a moment, I'm just trying to figuring things out.", "Give me a second... maybe more than one actually.", "This one's tricky... give me a moment... or two."]

[voice]
# Voice (TTS)
# The voice vivo speaks with: a reference clip (3-30 s of clear speech) that is cloned. Upload or record one below.
tts_voice = "default"
# Speech-rate multiplier applied to the cloned voice: 1.0 is the model's natural pace, higher is faster.
tts_speed = 0.85
# Silence appended after each spoken sentence.
sentence_pause_s = 0.3
# Hard split for long unpunctuated text. Shorter means the first audio arrives sooner at the cost of choppier phrasing.
sentence_max_chars = 250
# Split at clause punctuation (comma, semicolon, colon) once a sentence exceeds this length, so TTS can start before the whole sentence is generated. 0 disables it. Lower cuts first-audio latency; higher sounds smoother.
clause_max_chars = 200
# Sentences buffered between the LLM and TTS. Bigger hides TTS hiccups, smaller cuts latency.
tts_queue_size = 1

[stt]
# Speech-to-text
# faster-whisper model. Bigger is more accurate but slower to transcribe and slower to load.
model = "small"
# Precision for inference. int8 is the fast CPU default; float16 and int8_float16 need a GPU.
compute_type = "int8"
# Threads used for transcription.
cpu_threads = 8
# Transcription language code (en, de, fr, …).
language = "en"
# Search width: 1 (greedy) is fastest; higher is slightly more accurate.
beam_size = 1

[vad]
# Voice activity detection
# Level above which audio counts as speech. Raise it if ambient noise triggers vivo, lower it if it misses quiet speech.
threshold = 0.5
# Shortest burst of sound kept as speech; shorter blips are ignored.
min_speech_ms = 200
# Silence that puts an utterance on pause.
min_silence_ms = 2900
# Extra silence an utterance survives: speech resuming within this window continues the same utterance (breath pauses). 0 disables it.
reopen_ms = 300
# Context added around each captured utterance.
speech_pad_ms = 200
# Hard cap on a single utterance; longer speech is cut off and processed.
max_speech_s = 30

[barge_in]
# Barge-in (UI)
# While vivo is speaking, sustained mic level above this interrupts it. The browser's echo cancellation has already removed its own voice.
level_threshold = 0.25
# How long the mic level must stay above the threshold before it interrupts.
sustain_ms = 250
# Grace period after a barge-in before another one can trigger.
cooldown_ms = 700

[ui]
# UI display
# How long vivo's caption stays on screen after the last word of a message. Each new message (filler, acknowledgement, answer part) replaces it.
caption_linger_s = 22

[wake]
# Wake phrase
# Say this to wake vivo: it listens silently for it and ignores everything else, so ambient speech doesn't flood the transcript. Anything after the phrase in the same utterance is answered too. An empty phrase disables the wake word (it answers every utterance).
phrase = "hey vivo"
# Once awake, vivo returns to silent listening after you stay quiet this long. Any exchange restarts the clock; it never fires while it is replying.
session_timeout_s = 300
# Saying one of these (one per line) ends the session early: vivo confirms and returns to silent listening.
end_phrases = ["that's all", "goodbye", "go to sleep", "we're done", "we are done"]
# What vivo says right after the wake phrase when nothing else was said.
ack = "I'm listening"
# What vivo says when a session ends (timeout or end phrase).
goodnight = "Okay, going quiet."

[memory]
# Conversation memory
# Once the conversation history grows past this, older turns are summarised to keep the context small.
compact_after_chars = 12000
# How many recent turns stay verbatim during compaction.
keep_recent_turns = 4
# How often the background pass reviews local memory and keeps only high-value facts.
dream_interval_s = 3600

[agent]
# Agent tools
# How many tool-call rounds one reply may use before it must end with an answer.
max_tool_rounds = 8
# Default timeout for shell commands.
exec_timeout_s = 60
# Longest command timeout the model may request.
exec_max_timeout_s = 120
# Command output longer than this is truncated before it reaches the model.
exec_max_output_chars = 8000
# Maximum web-search results returned per query.
search_max_results = 5
# Maximum characters read from a web page.
fetch_max_chars = 6000
